name: ez-media

services:

  postgres:
    image: postgres:18
    container_name: ez-media-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ez_media}
      POSTGRES_USER: ${POSTGRES_USER:-ez_media}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - ez-media-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - ez-media-network


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ez-media-api

    restart: unless-stopped

    environment:
      NODE_ENV: production
      APP_NAME: EZ MEDIA
      APP_VERSION: 1.0.0

      HOST: 0.0.0.0
      PORT: 3000

      LOG_LEVEL: info

      DATABASE_URL: postgresql://${POSTGRES_USER:-ez_media}:${POSTGRES_PASSWORD:-change-this-password}@postgres:5432/${POSTGRES_DB:-ez_media}

      DATABASE_POOL_MAX: 10
      DATABASE_CONNECTION_TIMEOUT_MS: 5000
      DATABASE_IDLE_TIMEOUT_MS: 30000

      TRUST_PROXY: "false"

      CORS_ORIGINS: http://localhost:3000

      STORAGE_PROVIDER: disabled

      REDIS_URL:

      AI_PROVIDER: disabled

      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: ez-media-api

    ports:
      - "${API_PORT:-3000}:3000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - ez-media-network


volumes:
  ez-media-postgres-data:


networks:
  ez-media-network:
    driver: bridge
