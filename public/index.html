<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EZ MEDIA</title>

  <meta
    name="description"
    content="EZ MEDIA - Smart Digital Media Platform"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f1fbff 45%,
          #e4f7ff 100%
        );

      min-height: 100vh;
      color: #123;
    }

    main {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 900px;

      text-align: center;

      background: rgba(255,255,255,.82);

      border: 1px solid rgba(120,200,235,.3);

      border-radius: 28px;

      padding: 55px 30px;

      box-shadow:
        0 20px 60px
        rgba(80,170,210,.16);
    }

    h1 {
      margin: 0;

      font-size: clamp(
        42px,
        8vw,
        78px
      );

      letter-spacing: 2px;

      background:
        linear-gradient(
          90deg,
          #159dcc,
          #61d7ff
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;
    }

    p {
      font-size: 20px;

      line-height: 1.8;

      color: #47616d;
    }

    .status {
      display: inline-flex;

      align-items: center;

      gap: 10px;

      margin-top: 20px;

      padding: 12px 20px;

      border-radius: 999px;

      background: #effcff;

      color: #0784ae;

      font-weight: 700;
    }

    .dot {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #22b8e6;

      box-shadow:
        0 0 12px
        rgba(34,184,230,.7);
    }
  </style>
</head>

<body>

  <main>

    <section class="container">

      <h1>EZ MEDIA</h1>

      <p>
        منصة إعلامية رقمية ذكية
      </p>

      <div class="status">
        <span class="dot"></span>
        النظام يعمل
      </div>

    </section>

  </main>

</body>
</html>
