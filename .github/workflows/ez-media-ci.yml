name: EZ MEDIA CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ez-media-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.21.0"
  PNPM_VERSION: "12.9.1"

jobs:

  # ============================================================
  # 01 — فحص البيئة
  # ============================================================

  environment:
    name: environment

    runs-on: ubuntu-latest

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: عرض الإصدارات
        run: |
          echo "========================================"
          echo " EZ MEDIA ENVIRONMENT"
          echo "========================================"
          node --version
          pnpm --version
          git --version


  # ============================================================
  # 02 — تثبيت الاعتمادات
  # ============================================================

  install:
    name: install

    runs-on: ubuntu-latest

    needs:
      - environment

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile


  # ============================================================
  # 03 — فحص TypeScript
  # ============================================================

  typecheck:
    name: typecheck

    runs-on: ubuntu-latest

    needs:
      - install

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm typecheck


  # ============================================================
  # 04 — فحص التنسيق
  # ============================================================

  format:
    name: format

    runs-on: ubuntu-latest

    needs:
      - install

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: فحص Prettier
        run: |
          pnpm format:check


  # ============================================================
  # 05 — Build
  # ============================================================

  build:
    name: build

    runs-on: ubuntu-latest

    needs:
      - typecheck
      - format

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm build


  # ============================================================
  # 06 — Unit / Integration / Security Tests
  # ============================================================

  tests:
    name: tests

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: الاختبارات
        run: |
          pnpm test


  # ============================================================
  # 07 — Smoke Tests
  # ============================================================

  smoke:
    name: smoke

    runs-on: ubuntu-latest

    needs:
      - tests

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: Smoke Tests
        run: |
          pnpm test:smoke


  # ============================================================
  # 08 — فحص أمني للاعتمادات
  # ============================================================

  security:
    name: security

    runs-on: ubuntu-latest

    needs:
      - install

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: فحص الثغرات
        run: |
          pnpm audit --audit-level=high


  # ============================================================
  # 09 — فحص المستودع
  # ============================================================

  repository:
    name: repository

    runs-on: ubuntu-latest

    needs:
      - install

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: فحص الملفات الأساسية
        shell: bash
        run: |

          set -Eeuo pipefail

          REQUIRED_FILES=(
            "package.json"
            "pnpm-workspace.yaml"
            "tsconfig.json"
            "tsconfig.base.json"
            ".gitignore"
            ".env.example"
            "README.md"
            "apps/api/package.json"
            "apps/api/src/app.ts"
            "apps/api/src/server.ts"
            "apps/web/package.json"
            "apps/admin/package.json"
            "apps/worker/package.json"
            "vitest.config.ts"
          )

          FAILED=0

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ -f "$FILE" ]; then
              echo "✅ $FILE"
            else
              echo "❌ $FILE مفقود"
              FAILED=1
            fi

          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "فشل فحص ملفات EZ MEDIA الأساسية."
            exit 1
          fi

          echo ""
          echo "✅ جميع الملفات الأساسية موجودة."


  # ============================================================
  # 10 — فحص Auto Repair
  # ============================================================

  auto-repair:
    name: auto-repair

    runs-on: ubuntu-latest

    needs:
      - repository

    steps:

      - name: تحميل المستودع
        uses: actions/checkout@v5

      - name: إعداد Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: تثبيت الاعتمادات
        run: |
          pnpm install --frozen-lockfile

      - name: تشغيل Auto Repair
        run: |
          chmod +x scripts/maintenance/auto-repair.sh
          ./scripts/maintenance/auto-repair.sh


  # ============================================================
  # 11 — البوابة النهائية
  # ============================================================

  ci-gate:
    name: ci-gate

    runs-on: ubuntu-latest

    needs:
      - environment
      - install
      - typecheck
      - format
      - build
      - tests
      - smoke
      - security
      - repository
      - auto-repair

    if: always()

    steps:

      - name: التحقق من جميع الوظائف
        shell: bash
        run: |

          set -Eeuo pipefail

          echo "========================================"
          echo " EZ MEDIA CI GATE"
          echo "========================================"

          echo "environment: ${{ needs.environment.result }}"
          echo "install:     ${{ needs.install.result }}"
          echo "typecheck:   ${{ needs.typecheck.result }}"
          echo "format:      ${{ needs.format.result }}"
          echo "build:       ${{ needs.build.result }}"
          echo "tests:       ${{ needs.tests.result }}"
          echo "smoke:       ${{ needs.smoke.result }}"
          echo "security:    ${{ needs.security.result }}"
          echo "repository:  ${{ needs.repository.result }}"
          echo "auto-repair: ${{ needs.auto-repair.result }}"

          if [
            "${{ needs.environment.result }}" != "success" ] || [
            "${{ needs.install.result }}" != "success" ] || [
            "${{ needs.typecheck.result }}" != "success" ] || [
            "${{ needs.format.result }}" != "success" ] || [
            "${{ needs.build.result }}" != "success" ] || [
            "${{ needs.tests.result }}" != "success" ] || [
            "${{ needs.smoke.result }}" != "success" ] || [
            "${{ needs.security.result }}" != "success" ] || [
            "${{ needs.repository.result }}" != "success" ] || [
            "${{ needs.auto-repair.result }}" != "success"
          ]; then

            echo ""
            echo "❌ EZ MEDIA CI/CD
